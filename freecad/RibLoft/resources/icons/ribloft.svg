<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" version="1.1">
  <!-- RibLoft: two section profiles lofted corner-to-corner.
       Palette matches FreeCAD PartDesign feature icons (Tango):
       solid faces #fce94f/#c4a000, outline #302b00, sections #a40000/#ef2929 -->
  <defs>
    <linearGradient id="cap" x1="44" y1="15" x2="48" y2="33" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#edd400"/>
      <stop offset="1" stop-color="#c4a000"/>
    </linearGradient>
  </defs>
  <!-- lofted skin -->
  <path d="M 8,30 L 22,34 L 56,18 L 42,14 Z" style="fill:#fce94f;stroke:#302b00;stroke-width:2;stroke-linejoin:round"/>
  <path d="M 22,34 L 56,18 L 56,34 L 22,50 Z" style="fill:#c4a000;stroke:#302b00;stroke-width:2;stroke-linejoin:round"/>
  <!-- far end face + its section profile -->
  <path d="M 44,17 L 54,20 L 54,32 L 44,28 Z" style="fill:url(#cap);stroke:#edd400;stroke-width:2;stroke-linejoin:miter"/>
  <path d="M 42,14 L 56,18 L 56,34 L 42,30 Z" style="fill:none;stroke:#a40000;stroke-width:6;stroke-linejoin:round"/>
  <path d="M 42,14 L 56,18 L 56,34 L 42,30 Z" style="fill:none;stroke:#ef2929;stroke-width:2;stroke-linejoin:round"/>
  <!-- near section profile -->
  <path d="M 8,30 L 22,34 L 22,50 L 8,46 Z" style="fill:none;stroke:#a40000;stroke-width:6;stroke-linejoin:round"/>
  <path d="M 8,30 L 22,34 L 22,50 L 8,46 Z" style="fill:none;stroke:#ef2929;stroke-width:2;stroke-linejoin:round"/>
</svg>
